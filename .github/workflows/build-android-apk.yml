name: ASH LINE Android ARM64 APK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Android build configuration
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Shipping

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build ASH LINE Android ARM64 (${{ inputs.configuration }})
    runs-on: [self-hosted, Windows, X64, unreal-5.4, android]
    timeout-minutes: 180

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Decode Shipping keystore when requested
        if: inputs.configuration == 'Shipping'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_B64)) {
            throw 'Shipping requires secret ANDROID_KEYSTORE_B64 (base64 encoded keystore).'
          }
          $path = Join-Path $env:RUNNER_TEMP 'ashline-release.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64))
          "ANDROID_KEYSTORE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, cook, package and verify APK
        env:
          UE_ROOT_HINT: ${{ vars.UE_ROOT }}
          ANDROID_HOME_HINT: ${{ vars.ANDROID_HOME }}
          ANDROID_NDK_HOME_HINT: ${{ vars.ANDROID_NDK_HOME }}
          JAVA_HOME_HINT: ${{ vars.JAVA_HOME }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\Scripts\Build\BuildFirstAPK.ps1" `
            -ProjectRoot $env:GITHUB_WORKSPACE `
            -Configuration '${{ inputs.configuration }}' `
            -PreferredUnrealRoot $env:UE_ROOT_HINT `
            -PreferredAndroidHome $env:ANDROID_HOME_HINT `
            -PreferredAndroidNdkHome $env:ANDROID_NDK_HOME_HINT `
            -PreferredJavaHome $env:JAVA_HOME_HINT

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ash-line-android-apk-${{ inputs.configuration }}
          path: Releases/Android/0.0.1/APK/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-line-android-reports-${{ inputs.configuration }}
          path: |
            Releases/Android/0.0.1/Reports/**
            Releases/Android/0.0.1/Checksums/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Unreal logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ash-line-unreal-logs-${{ inputs.configuration }}
          path: |
            Saved/Logs/**
            AutomationTool/Saved/Logs/**
          if-no-files-found: ignore
          retention-days: 7
